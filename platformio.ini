; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = W500

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = 
	arduino-libraries/Ethernet @ ^2.0.0
	adafruit/Adafruit Unified Sensor @ ^1.1.4
	adafruit/DHT sensor library @ ^1.4.2
	milesburton/DallasTemperature @ ^3.9.1
	mysensors/MySensors @ 2.3.2
	; mysensors/MySensors @ 2.2.0
  ; https://github.com/mysensors/MySensors.git#2.2.0   ;esta version ya no está disponible en platformio, se debe instalar desde github
	paulstoffregen/Time @ 1.6.1

[env:USB]
build_flags = 
	-D USBGATEWAY

[env:W500]
build_flags = 
    -D W5100GATEWAY
    -D "MY_IP_ADDRESS=192,168,100,61"  ; dirección IP del gateway
    -D "PINGADDRESS=192,168,100,60"    ; dirección IP del nodo a hacer ping (SCD-Domoticz)

[env:W500test]
build_flags = 
    -D W5100TEST
    -D "MY_IP_ADDRESS=192,168,1,61"   ; dirección IP del gateway
    -D "PINGADDRESS=192,168,1,50"     ; dirección IP del nodo a hacer ping (SCD-Domoticz)